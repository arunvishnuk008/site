services:
  frontend:
    build:
      context: ./crimson-sunrise
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./crimson-sunrise-backend
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
