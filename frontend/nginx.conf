server {
    listen 80;
    server_name localhost;

    # Increase max upload size if users upload files to your data folder
    client_max_body_size 100M;

    # Serve Angular static files
    location / {
        root /usr/share/nginx/html;
# root /opt/crimson-sunrise/sunrise-frontend/crimson-sunrise/dist/crimson-sunrise/browser;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Go backend (strips /api/ prefix)
    location /prerise/ {
        proxy_pass http://backend:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
